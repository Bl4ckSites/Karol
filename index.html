<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="theme-color" content="#000000">

  <!-- Preloads críticos -->
  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <link rel="dns-prefetch" href="https://challenges.cloudflare.com">
  <link rel="preload" href="./assets/styles.css" as="style">
  <link rel="preload" href="./assets/index.js" as="script">

  <title>Karol...</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="page-index">

  <main class="center-wrap">
    <div class="loader-card" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="loader-title">Carregando...</h1>
      <p class="loader-sub">Preparando sua experiência ✨</p>
    </div>
  </main>

  <!-- Modal de redirecionamento -->
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <h2 class="modal-title">Continuar no navegador?</h2>
      <p class="modal-desc">Para ver todo o conteúdo sem travamentos e com mais privacidade, continue em seu navegador padrão. 🔒</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnYes">Abrir no navegador</button>
        <button class="btn btn-ghost" id="btnNo">Não</button>
      </div>
      <p class="modal-hint">Recomendado para maior privacidade</p>
    </div>
  </div>

  <script src="./assets/index.js"></script>
</body>
</html>

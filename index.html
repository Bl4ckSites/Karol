


<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="./assets/styles.css" as="style">
  <link rel="preload" href="./assets/profile.avif" as="image" type="image/avif">
  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="page-index">
  <main class="center-wrap">
    <div class="loader-card" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="loader-title">Carregando...</h1>
      <p class="loader-sub">Verificando acesso ✨</p>
    </div>

    <div class="presite" id="presite" style="display:none;">
      <div class="profile-wrap">
        <img class="profile-img" src="./assets/profile.avif" alt="Foto de perfil de Karol Vasconcellos">
      </div>
      <h1 class="name">Karol Vasconcellos</h1>
      <div class="social-row">
        <span class="icon-btn" aria-label="Instagram">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.3" cy="6.7" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </span>
      </div>
      <button class="btn btn-primary btn-access" id="btnAccess">Clique aqui para acessar!</button>
      <p class="presite-hint">Conteúdo exclusivo 🔒</p>
    </div>
  </main>
  <script src="./assets/index.js"></script>
</body>
</html>

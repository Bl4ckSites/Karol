<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  
  <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
  <link rel="shortcut icon" href="/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="theme-color" content="#000000">
  <title>Karol</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="page-index">

  <main class="center-wrap">
    <div class="loader-card" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="loader-title">Abrindo...</h1>
      <p class="loader-sub">Preparando sua experiência ✨</p>
    </div>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 class="modal-title">Continuar no navegador?</h2>
      <p class="modal-desc">Para ver todo o conteúdo sem travamentos e com mais privacidade, continue em seu navegador padrão. 🔒</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnYes">Abrir no navegador</button>
        <button class="btn btn-ghost" id="btnNo">Não</button>
      </div>
    </div>
  </div>

  <script src="./assets/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="theme-color" content="#000000">

  <link rel="preload" href="./assets/styles.css" as="style">
  <link rel="preload" href="./assets/profile.avif" as="image" type="image/avif">

  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="./assets/styles.css">

  <style>
    /* ============================================
       PRÉ-SITE (estilo referência) — FUNDO PRETO
       ============================================ */
    body { background: #000000; }

    .presite-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 20px 0;
      text-align: center;
    }

    /* Logo / nome no topo */
    .brand {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 110px;
      animation: fadeInDown 0.7s ease-out both;
    }
    .brand span { color: var(--accent, #2f80d0); }

    /* Card arredondado com a foto "saltada" por cima */
    .hero-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      background: #161616;
      border: 1px solid #2c2c2c;
      border-radius: 44px;
      padding: 0 28px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      animation: fadeInUp 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) 0.1s both;
    }

    .hero-photo {
      display: block;
      width: 184px;
      height: 184px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      background: #1a1a1a;
      margin: -92px auto 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      animation: float 5s ease-in-out infinite;
    }

    /* Botão verde com brilho pulsante */
    .btn-green {
      margin-top: 28px;
      width: 100%;
      padding: 20px 22px;
      border: none;
      border-radius: 38px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #ffffff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.08rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.4), 0 10px 26px rgba(0, 0, 0, 0.55);
      animation: greenPulse 2s ease-in-out infinite;
      transition: transform 0.15s ease;
    }
    .btn-green:active { transform: scale(0.97); animation: none; }

    @keyframes greenPulse {
      0%, 100% { box-shadow: 0 0 16px rgba(34, 197, 94, 0.35), 0 10px 26px rgba(0, 0, 0, 0.55); }
      50%      { box-shadow: 0 0 34px rgba(34, 197, 94, 0.65), 0 10px 26px rgba(0, 0, 0, 0.55); }
    }

    .footer-copy {
      margin: 36px 0 30px;
      color: #666666;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      animation: fadeInUp 0.6s ease-out 0.5s both;
    }
  </style>
</head>
<body>

  <main class="presite-page">

    <h1 class="brand">Karol<span>Vasconcellos</span></h1>

    <div class="hero-card">
      <img class="hero-photo" id="profileImg" src="./assets/profile.avif"
           alt="Foto de perfil de Karol Vasconcellos">
      <button class="btn-green" id="btnAccess">Clique aqui para acessar</button>
    </div>

    <p class="footer-copy">Karol Vasconcellos © 2026. All rights reserved.</p>

  </main>

  <script>
  // ============================================
  // PRÉ-SITE MANUAL — clique → navegador externo
  // Robô → 404 | Humano → botão → links.html
  // ============================================
  (function () {
    'use strict';

    var TARGET_REL = './links.html';
    var TARGET_ABS = window.location.origin + '/links.html';
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var leftPage = false;

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) leftPage = true;
    });

    // ---------- Detecção de robô (só automação) ----------
    function isBot() {
      if (navigator.webdriver === true) return true;
      return /bot|crawler|spider|headless|puppeteer|selenium|phantomjs|curl\/|wget|python-requests|scrapy|httpclient/i.test(ua);
    }

    // ---------- Som de clique ----------
    function playClickSound() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1200;
        osc.connect(gain);
        gain.connect(ctx.destination);
        var now = ctx.currentTime;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    // ---------- Saída para o navegador externo ----------
    function exitToExternal() {
      if (isAndroid) {
        window.location.href =
          'intent://' + window.location.host + '/links.html#Intent;' +
          'scheme=https;' +
          'action=android.intent.action.VIEW;' +
          'S.browser_fallback=' + encodeURIComponent(TARGET_ABS) + ';' +
          'end';
        setTimeout(function () {
          if (!leftPage) window.location.href = TARGET_ABS;
        }, 900);
      } else if (isIOS) {
        var w = window.open(TARGET_ABS, '_blank');
        if (!w) window.location.href = TARGET_ABS;
      } else {
        window.location.href = TARGET_REL;
      }
    }

    // ---------- Fallback da foto ----------
    var img = document.getElementById('profileImg');
    if (img) {
      img.addEventListener('error', function () {
        img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">' +
          '<rect width="120" height="120" fill="#1a1a1a"/>' +
          '<circle cx="60" cy="46" r="22" fill="#444"/>' +
          '<ellipse cx="60" cy="98" rx="34" ry="26" fill="#444"/>' +
          '</svg>'
        );
      });
    }

    // ---------- Robô → 404 ----------
    if (isBot()) {
      window.location.replace('./404.html');
      return;
    }

    // ---------- Botão → navegador externo ----------
    var btn = document.getElementById('btnAccess');
    if (btn) {
      btn.addEventListener('click', function (e) {
        playClickSound();
        if (navigator.vibrate) navigator.vibrate(10);

        // ripple
        var rect = btn.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height) * 0.8;
        var r = document.createElement('span');
        r.className = 'ripple';
        r.style.width = r.style.height = size + 'px';
        r.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left - size / 2) + 'px';
        r.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top - size / 2) + 'px';
        btn.appendChild(r);

        setTimeout(function () {
          if (r.parentNode) r.parentNode.removeChild(r);
          exitToExternal();
        }, 250);
      });
    }
  })();
  </script>
</body>
</html>

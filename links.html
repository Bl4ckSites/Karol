<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#dceeff">
  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="page-links">

  <main class="container">

    <header class="profile">
      <div class="profile-wrap">
        <img id="profileImg" class="profile-img" src="./assets/profile.avif"
             alt="Foto de perfil de Karol Vasconcellos">
      </div>
      <h1 class="name">Karol Vasconcellos</h1>
      <div class="social-row">
        <a class="icon-btn" href="https://instagram.com/soykarolinareal"
           target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.3" cy="6.7" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </div>
    </header>

    <nav class="links" id="linksContainer" aria-label="Links">
      <p class="loading">Carregando...</p>
    </nav>

    <footer class="footer">soykarolinareal.com</footer>
  </main>

  <div class="modal" id="ageModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 class="modal-title">Você tem mais de 18 anos?</h2>
      <p class="modal-desc">Este conteúdo é destinado apenas a maiores de idade. Ao continuar, você confirma que tem 18 anos ou mais.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="confirmAge">Sim, tenho 18+</button>
        <button class="btn btn-ghost" id="denyAge">Não</button>
      </div>
    </div>
  </div>

  <noscript>
    <p style="text-align:center;color:#0c2f5a;padding:30px;">Ative o JavaScript para ver os links.</p>
  </noscript>

  <script src="./assets/links.js"></script>
</body>
</html>
